<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <header>
        <h1>Formulário</h1>
        <p>Apresentação de uso de formulários</p>
    </header>
    <nav>
        <a href="index.html">Início</a>
        <a href="video.html">Vídeo</a>
    </nav>
    <main>

        <section>
            <h2>Formulário de Contato</h2>
            <p>Preencha o formulário abaixo:</p>

            <form action="#" method="post">

            <label for="nome">Nome:</label>

            <input type="text" id="nome" name="nome" required>

            <label for="email">Email</label>

            <input type="email" id="email" name="email" required>

            <label for="nascimento">Data de Nascimento:</label>

            <input type="date" id="nascimento" name="nascimento">

            
           <fieldset>
                    <legend>Recomendaria a academia</legend>

                    <label class="opcao">
                        <input type="radio" name="recomendaria" value="sim" required> Sim
                    </label>
                    <label class="opcao">
                        <input type="radio" name="recomendaria" value="nao" required> Não
                    </label>
                </fieldset>
          
             <div class="botoes">
                <button type="submit">Enviar</button>
                <button type="reset">Limpar</button>
            </div>
            
            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" rows="5"></textarea>

            <label class="opcao">
                <input type="checkbox" name="novidade"> 
                Quero receber novidade
            </label>

          

            </form>
        </section>
    </main>
   
   
</head>
